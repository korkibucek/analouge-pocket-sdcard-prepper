<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analogue Pocket SD Card Prepper</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Analogue Pocket SD Card Prepper</h1>
    <p class="warn">Local tool · copies files only · never formats or deletes your data · copies ROMs you already own · not affiliated with Analogue.</p>
    <p id="ctx" class="ctx" role="status" aria-live="polite"></p>
  </header>

  <nav id="steps" aria-label="Steps"></nav>

  <main id="app">
    <section id="panel" class="panel" tabindex="-1"><p>Connecting to the local server…</p></section>
  </main>

  <!-- Screen-reader live region: concise step/status announcements. -->
  <div id="sr-status" class="visually-hidden" role="status" aria-live="polite"></div>

  <footer>
    <button id="backBtn" class="secondary" hidden>← Back</button>
    <button id="nextBtn" hidden>Next →</button>
    <span id="busy" class="busy" hidden>working…</span>
  </footer>

  <script>
    /* Classic-syntax guard (must parse on old browsers): if the browser lacks the
       required APIs, or app.js fails to parse/bootstrap, show guidance instead of a
       blank page. Supported baseline: Chrome/Edge 80+, Firefox 74+, Safari 13.1+. */
    window.POCKETPREP_TOKEN = "__POCKETPREP_TOKEN__";
    (function () {
      var msg = 'This tool needs a modern browser (Chrome/Edge 80+, Firefox 74+, Safari 13.1+). '
              + 'Please update your browser, or use the command-line wizard.';
      function showUnsupported() {
        var p = document.getElementById('panel');
        if (p && !window.__pocketUp) { p.innerHTML = '<p class="error">' + msg + '</p>'; }
      }
      window.addEventListener('error', showUnsupported);
      if (!window.fetch || !window.Promise || !document.querySelector) { showUnsupported(); }
    })();
  </script>
  <script src="/app.js"></script>
</body>
</html>
