<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analogue Pocket SD Card Prepper</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Analogue Pocket SD Card Prepper</h1>
    <p class="warn">Local tool · copies files only · never formats or deletes · not affiliated with Analogue.</p>
  </header>
  <main id="app">
    <p id="status">Connecting to the local server…</p>
    <pre id="out" hidden></pre>
  </main>
  <script>
    // The server injects the session token here when serving this page.
    window.POCKETPREP_TOKEN = "__POCKETPREP_TOKEN__";
  </script>
  <script src="/app.js"></script>
</body>
</html>
