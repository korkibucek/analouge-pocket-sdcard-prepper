name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Lint
        shell: pwsh
        run: ./scripts/Invoke-Lint.ps1
      - name: Validate manifests
        shell: pwsh
        run: ./scripts/Validate-Manifests.ps1

  web-ui:
    name: Web UI test (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install web test deps
        working-directory: tests/web
        run: npm ci || npm install
      - name: Audit web dev dependencies
        working-directory: tests/web
        run: npm audit --audit-level=high
      - name: Run web UI test
        working-directory: tests/web
        run: npm test

  test:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Pester 5
        shell: pwsh
        run: Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck -MinimumVersion 5.0.0

      - name: Run test suite
        shell: pwsh
        run: ./scripts/Run-Tests.ps1 -CI
