name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Pester tests (Windows, PowerShell 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester 5
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck -MinimumVersion 5.0.0

      - name: Run test suite
        shell: pwsh
        run: ./scripts/Run-Tests.ps1 -CI

  test-linux:
    name: Pester tests (Linux, cross-platform logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester 5
        shell: pwsh
        run: |
          Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck -MinimumVersion 5.0.0

      - name: Run test suite
        shell: pwsh
        run: ./scripts/Run-Tests.ps1 -CI
