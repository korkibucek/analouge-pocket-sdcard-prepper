name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Lint
        shell: pwsh
        run: ./scripts/Invoke-Lint.ps1
      - name: Validate manifests
        shell: pwsh
        run: ./scripts/Validate-Manifests.ps1

  web-ui:
    name: Web UI test (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install web test deps
        working-directory: tests/web
        run: npm ci || npm install
      - name: Audit web dev dependencies
        working-directory: tests/web
        run: npm audit --audit-level=high
      - name: Run web UI test
        working-directory: tests/web
        run: npm test

  test:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Pester 5
        shell: pwsh
        run: Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck -MinimumVersion 5.0.0

      - name: Run test suite
        shell: pwsh
        run: ./scripts/Run-Tests.ps1 -CI

  package-deb:
    name: Package (zip + .deb) + install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build the release zip
        shell: pwsh
        run: ./scripts/Build-Release.ps1
      - name: Build the .deb
        run: bash scripts/Build-Deb.sh
      - name: Install the .deb (verifies it installs without a hard PowerShell dependency)
        run: sudo apt-get install -y ./dist/pocketprep_*_all.deb
      - name: Install smoke — launcher on PATH + module imports under pwsh
        shell: bash
        run: |
          set -euo pipefail
          command -v pocketprep
          test -f /usr/lib/pocketprep/scripts/pocketprep.sh
          pwsh -NoProfile -Command "Import-Module /usr/lib/pocketprep/src/PocketPrep/PocketPrep.psd1 -Force; if (-not (Get-Command Start-PocketPrepServer -ErrorAction SilentlyContinue)) { throw 'module did not import from the installed layout' }; 'package smoke OK'"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
          if-no-files-found: error

  package-rpm:
    name: Package (.rpm, Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v6
      - name: Install build deps
        run: dnf install -y rpm-build jq
      - name: Build the .rpm
        run: bash scripts/Build-Rpm.sh
      - name: Verify an .rpm was produced and lists the launcher
        run: |
          set -euo pipefail
          RPM=$(ls dist/*.rpm | head -1)
          echo "Built: $RPM"
          # Capture to files first: `cmd | grep -q` would SIGPIPE the producer (exit 141)
          # under pipefail once grep matches and closes the pipe.
          rpm -qlp "$RPM" > /tmp/rpm-files.txt
          rpm -qpR "$RPM" > /tmp/rpm-reqs.txt
          grep -q '/usr/bin/pocketprep' /tmp/rpm-files.txt
          grep -qi powershell /tmp/rpm-reqs.txt   # weak dep present
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm
          if-no-files-found: error
